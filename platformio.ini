[platformio]
default_envs = esp32-cyd

[env:esp32-cyd]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
board_build.f_cpu = 240000000L
board_build.flash_size = 4MB
board_build.flash_mode = dio
board_build.filesystem = spiffs
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.3
    bodmer/TFT_eSPI @ ^2.5.43

; TFT_eSPI：CYD2USB 批次 (ESP32-2432S028R Type-C) = ST7789 驱动
; 配置参照 OttoMeister/ESP32-2432S028R 项目 [env:cyd2usb] 实测参数
build_flags =
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_OFF
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=55000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1